<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="flatpickr.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-window">
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
      <div class="spinner"></div>
    </div>

    <div class="app-container">
      <header class="app-header">
        <h2 data-i18n="title"></h2>
        <div class="settings-section">
          <div class="language-switch">
            <label><input type="radio" name="language" value="fa" checked><span data-i18n="persian"></span></label>
            <label><input type="radio" name="language" value="en"><span data-i18n="english"></span></label>
          </div>
          <div class="dark-mode-toggle">
            <label><input type="checkbox" id="darkModeToggle"><span data-i18n="darkMode"></span></label>
          </div>
        </div>
      </header>

      <aside class="sidebar">
        <h3 data-i18n="filters"></h3>
        <div class="filter-section">
          <div class="input-group">
            <label for="keyword" data-i18n="keyword"></label>
            <input type="text" id="keyword" data-i18n-placeholder="searchPlaceholder">
          </div>
          <div class="input-group">
            <label for="matchType" data-i18n="matchType"></label>
            <select id="matchType">
              <option value="contains" data-i18n="contains"></option>
              <option value="exact" data-i18n="exact"></option>
            </select>
          </div>
          <div class="input-group">
            <label for="domain" data-i18n="domain"></label>
            <input type="text" id="domain" data-i18n-placeholder="domainPlaceholder">
          </div>
          <div class="input-group">
            <label for="startTime" data-i18n="startTime"></label>
            <input type="text" id="startTime" placeholder="YYYY-MM-DD HH:mm:ss">
          </div>
          <div class="input-group">
            <label for="endTime" data-i18n="endTime"></label>
            <input type="text" id="endTime" placeholder="YYYY-MM-DD HH:mm:ss">
          </div>
          <div class="input-group">
            <label for="minVisits" data-i18n="minVisits"></label>
            <input type="number" id="minVisits" min="1" data-i18n-placeholder="minVisitsPlaceholder">
          </div>
        </div>
        <div class="button-group">
          <button id="searchBtn" data-i18n="search"></button>
        </div>
        <div class="delete-buttons-group">
          <button id="exportCsvBtn" data-i18n="exportCsv"></button>
          <button id="exportJsonBtn" data-i18n="exportJson"></button>
          <button id="deleteSelectedBtn" data-i18n="deleteSelected"></button>
          <button id="deleteAllBtn" data-i18n="deleteAll"></button>
        </div>
      </aside>

      <main class="main-content">
        <div id="stats" class="stats-section"></div>
        <div id="chartContainer" class="chart-container">
          <div class="chart">
            <div class="chart-bar" id="resultsBar"><div class="chart-label" data-i18n="resultsLabel"></div></div>
            <div class="chart-bar" id="visitsBar"><div class="chart-label" data-i18n="visitsLabel"></div></div>
          </div>
        </div>
        <div id="results" class="results-section"></div>
        <nav id="pagination" class="pagination" aria-label="Pagination" hidden>
          <label for="resultsPerPage" data-i18n="resultsPerPage"></label>
          <select id="resultsPerPage">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <div class="pagination-navigation">
            <button id="previousPageBtn" type="button" data-i18n="previousPage"></button>
            <span id="pageIndicator" aria-live="polite"></span>
            <button id="nextPageBtn" type="button" data-i18n="nextPage"></button>
          </div>
        </nav>
      </main>
    </div>
  </div>
<script src="flatpickr.min.js"></script>
<script src="browser-polyfill.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
