<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser History Search</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 600px;
      min-width: 300px;
      max-width: 800px;
      height: 600px;
      min-height: 300px;
      max-height: 800px;
      resize: both;
      overflow: auto;
    }
    
    @media (max-width: 480px) {
      body {
        width: 100%;
        min-width: 280px;
        max-width: 100%;
        height: auto;
        max-height: none;
      }
    }
    
    .error {
      color: #d32f2f;
      background-color: #ffebee;
      padding: 10px;
      border-radius: 4px;
      border-left: 4px solid #d32f2f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Browser History Search</h2>
    
    <div class="settings-section">
      <div class="language-switch">
        <label>
          <input type="radio" name="language" value="fa"> فارسی
        </label>
        <label>
          <input type="radio" name="language" value="en" checked> English
        </label>
      </div>

      <div class="dark-mode-toggle">
        <label>
          <input type="checkbox" id="darkModeToggle">
          Dark Mode
        </label>
      </div>
    </div>

    <div class="filter-section">
      <div class="input-group">
        <label for="keyword">Keyword:</label>
        <input type="text" id="keyword" placeholder="Search...">
      </div>

      <div class="input-group">
        <label for="matchType">Match Type:</label>
        <select id="matchType">
          <option value="contains">Contains</option>
          <option value="exact">Exact</option>
        </select>
      </div>

      <div class="input-group">
        <label for="domain">Domain:</label>
        <input type="text" id="domain" placeholder="Example: google.com">
      </div>

      <div class="input-group">
        <label for="startTime">From Date:</label>
        <input type="datetime-local" id="startTime">
      </div>

      <div class="input-group">
        <label for="endTime">To Date:</label>
        <input type="datetime-local" id="endTime">
      </div>

      <div class="input-group">
        <label for="minVisits">Minimum Visits:</label>
        <input type="number" id="minVisits" min="0">
      </div>
    </div>

    <div class="button-group">
      <button id="searchBtn">Search</button>
      <button id="exportCsvBtn">Export CSV</button>
      <button id="exportJsonBtn">Export JSON</button>
    </div>

    <div class="delete-buttons-group">
      <button id="deleteSelectedBtn">Delete Selected</button>
      <button id="deleteAllBtn">Delete All</button>
    </div>

    <div id="stats" class="stats-section"></div>

    <div id="chartContainer" class="chart-container">
      <div class="chart">
        <div class="chart-bars">
          <div class="chart-bar" id="resultsBar">
            <div class="chart-label">Results Count</div>
          </div>
          <div class="chart-bar" id="visitsBar">
            <div class="chart-label">Visits Count</div>
          </div>
        </div>
      </div>
    </div>

    <div id="results" class="results-section"></div>
  </div>
  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
